# Production: the app behind Caddy, which gets and renews the HTTPS certificate. See docs/deploy.md.
# Settings come from .env next to this file (copy .env.example).
services:
  app:
    build: .
    image: spellbound
    restart: unless-stopped
    environment:
      RavenDb__License: ${RAVEN_LICENSE:?Set RAVEN_LICENSE in .env}
      Admins__0: ${ADMIN_EMAIL:-}
    volumes:
      - spellbound-data:/data
    # No ports: only Caddy can reach the app, which is what makes trusting its forwarded headers safe.

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  spellbound-data:
  caddy-data:
  caddy-config:
