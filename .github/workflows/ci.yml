name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SPELLBOUND_TEST_POSTGRES: Host=localhost;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Spellbound.slnx
      - run: dotnet build Spellbound.slnx --no-restore -c Release
      - run: dotnet test Spellbound.slnx --no-build -c Release

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the compose files
        run: |
          DOMAIN=example.com POSTGRES_PASSWORD=placeholder GOOGLE_CLIENT_ID=placeholder GOOGLE_CLIENT_SECRET=placeholder \
            PRIVACY_OPERATOR=placeholder PRIVACY_CONTACT=placeholder PRIVACY_HOSTING=placeholder docker compose config --quiet
          docker compose -f docker-compose.dev.yml config --quiet
      - run: docker build -t spellbound .
      - name: Smoke test the image (migrates a fresh database, then takes its first backup)
        run: |
          docker network create smoke
          docker run -d --name db --network smoke -e POSTGRES_DB=spellbound -e POSTGRES_USER=spellbound \
            -e POSTGRES_PASSWORD=smoke postgres:16
          for i in $(seq 1 60); do docker exec db pg_isready -h 127.0.0.1 -U spellbound -d spellbound && break; sleep 1; done
          docker exec db pg_isready -h 127.0.0.1 -U spellbound -d spellbound || { docker logs db; exit 1; }
          docker run -d --name spellbound --network smoke -p 8080:8080 \
            -e "ConnectionStrings__Spellbound=Host=db;Database=spellbound;Username=spellbound;Password=smoke" \
            -e Authentication__Google__ClientId=smoke -e Authentication__Google__ClientSecret=smoke \
            -e Privacy__Operator=smoke -e Privacy__Contact=smoke -e Privacy__Hosting=smoke spellbound
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/healthz && sleep 5 && docker exec spellbound sh -c 'ls /data/backups/*.dump'; then
              exit 0
            fi
            sleep 2
          done
          docker logs spellbound
          exit 1
