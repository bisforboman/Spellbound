name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Spellbound.slnx
      - run: dotnet build Spellbound.slnx --no-restore -c Release
      - run: dotnet test Spellbound.slnx --no-build -c Release
